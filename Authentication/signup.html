<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="auth.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="card shadow-lg rounded border-0 animated-card">
            <div class="card-body">
                <h4 class="card-title">Sign Up</h4>
                <form id="signupForm">
                    <div class="form-group mb-4">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-chess-queen"></i></span>
                            <input type="text" class="form-control animated-input" id="username" name="username" placeholder="Choose a username" required>
                        </div>
                    </div>
                    <div class="form-group mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-chess-pawn"></i></span>
                            <input type="password" class="form-control animated-input" id="password" name="password" placeholder="Choose a password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn animated-button w-100">Sign Up</button>
                </form>
                <div class="text-center mt-4">
                    <button id="homeButton" class="btn btn-secondary">Home</button>
                    <p class="mb-0">Already have an account? <a href="login.html" class="link-primary">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
    <script src="signup.js"></script>
</body>
</html>
